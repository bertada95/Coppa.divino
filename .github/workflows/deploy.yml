name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # (Sostituisci con 'master' se il tuo ramo principale si chiama così)

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'  # Specifica la cartella del tuo sito, es. 'dist' o 'build' se usi framework

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
